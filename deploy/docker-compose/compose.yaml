services:
  postgres:
    image: postgis/postgis:16-3.4
    platform: linux/amd64
    restart: unless-stopped
    environment:
      POSTGRES_DB: aerocompliance
      POSTGRES_USER: aerocompliance
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U aerocompliance -d aerocompliance"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    networks: [backend]

  rabbitmq:
    image: rabbitmq:4.3.6-management
    platform: linux/amd64
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: aerocompliance
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD is required}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s
    networks: [backend]

  minio:
    image: tala211/aerocompliance-minio:2025.09.07-amd64
    platform: linux/amd64
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: aerocompliance
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:?MINIO_SECRET_KEY is required}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks: [backend]

  api:
    image: tala211/aerocompliance-api:2026.10.08-amd64
    platform: linux/amd64
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: Demo
      DOTNET_ENVIRONMENT: Demo
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__aerocompliancedb: Host=postgres;Port=5432;Database=aerocompliance;Username=aerocompliance;Password=${POSTGRES_PASSWORD};Include Error Detail=false
      ConnectionStrings__messaging: amqp://aerocompliance:${RABBITMQ_PASSWORD}@rabbitmq:5672
      MinIO__Endpoint: http://minio:9000
      MinIO__AccessKey: aerocompliance
      MinIO__SecretKey: ${MINIO_SECRET_KEY}
      MinIO__Bucket: aerocompliance-images
      Jwt__Issuer: AeroCompliance
      Jwt__Audience: AeroCompliance.Clients
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?JWT_SIGNING_KEY is required}
      Jwt__AccessTokenMinutes: "30"
      Jwt__RefreshTokenDays: "7"
      Database__ApplyMigrationsOnStartup: "true"
      DemoSeed__Enabled: "true"
      DemoSeed__Password: ${DEMO_PASSWORD:?DEMO_PASSWORD is required}
      DemoMode__Enabled: "true"
      HealthChecks__Expose: "true"
      HttpsRedirection__Enabled: "false"
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
      minio: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 30s
    networks: [backend]

  processing:
    image: tala211/aerocompliance-processing:2026.10.08-amd64
    platform: linux/amd64
    restart: unless-stopped
    environment:
      DOTNET_ENVIRONMENT: Demo
      ConnectionStrings__aerocompliancedb: Host=postgres;Port=5432;Database=aerocompliance;Username=aerocompliance;Password=${POSTGRES_PASSWORD};Include Error Detail=false
      ConnectionStrings__messaging: amqp://aerocompliance:${RABBITMQ_PASSWORD}@rabbitmq:5672
    depends_on:
      api: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "grep -aq 'AeroCompliance.ProcessingService.dll' /proc/1/cmdline"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 10s
    networks: [backend]

  ai-worker:
    image: tala211/aerocompliance-ai-worker:2026.10.08-amd64
    platform: linux/amd64
    restart: unless-stopped
    environment:
      AI_MODE: ${AEROCOMPLIANCE_AI_MODE:-mock}
      AI_MODEL_PATH: /models/best.pt
      AI_CONFIDENCE_THRESHOLD: "0.25"
      AI_MODEL_NAME: ${AEROCOMPLIANCE_AI_MODEL_NAME:-aerocompliance-mock}
      AI_MODEL_VERSION: ${AEROCOMPLIANCE_AI_MODEL_VERSION:-1.0}
      RABBITMQ_URL: amqp://aerocompliance:${RABBITMQ_PASSWORD}@rabbitmq:5672
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: aerocompliance
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_SECURE: "false"
      MINIO_BUCKET: aerocompliance-images
      HEALTH_PORT: "8080"
    volumes:
      - type: bind
        source: ${AEROCOMPLIANCE_MODEL_DIR:-./models}
        target: /models
        read_only: true
        bind:
          create_host_path: true
    depends_on:
      rabbitmq: { condition: service_healthy }
      minio: { condition: service_healthy }
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/ready', timeout=3)"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks: [backend]

  frontend:
    image: tala211/aerocompliance-frontend:2026.10.08-amd64
    platform: linux/amd64
    restart: unless-stopped
    environment:
      API_UPSTREAM: http://api:8080
    ports:
      - "${AEROCOMPLIANCE_BIND_ADDRESS:-127.0.0.1}:${AEROCOMPLIANCE_HTTP_PORT:-8080}:8080"
    depends_on:
      api: { condition: service_healthy }
      processing: { condition: service_healthy }
      ai-worker: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    networks: [frontend, backend]

networks:
  frontend: {}
  backend:
    internal: true

volumes:
  postgres-data: {}
  rabbitmq-data: {}
  minio-data: {}
