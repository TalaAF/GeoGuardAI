[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid
childlogdir=/tmp

[program:postgres]
command=/opt/aerocompliance/bin/run-postgres
user=postgres
priority=10
autostart=true
autorestart=true
startsecs=5
startretries=30
stopasgroup=true
killasgroup=true
stopwaitsecs=60
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:rabbitmq]
command=/opt/aerocompliance/bin/run-rabbitmq
user=rabbitmq
priority=10
autostart=true
autorestart=true
startsecs=10
startretries=30
stopasgroup=true
killasgroup=true
stopwaitsecs=90
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:minio]
command=/usr/local/bin/minio server /var/lib/aerocompliance/minio --console-address :9001
user=aerocompliance
priority=10
autostart=true
autorestart=true
startsecs=5
startretries=30
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:api]
command=/opt/aerocompliance/bin/run-api
user=aerocompliance
priority=20
autostart=true
autorestart=true
startsecs=10
startretries=30
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:processing]
command=/opt/aerocompliance/bin/run-processing
user=aerocompliance
priority=30
autostart=true
autorestart=true
startsecs=10
startretries=30
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:ai-worker]
command=/opt/aerocompliance/bin/run-ai-worker
user=aerocompliance
priority=30
autostart=true
autorestart=true
startsecs=10
startretries=30
stopasgroup=true
killasgroup=true
stopwaitsecs=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:nginx]
command=/opt/aerocompliance/bin/run-nginx
priority=40
autostart=true
autorestart=true
startsecs=5
startretries=30
stopasgroup=true
killasgroup=true
stopwaitsecs=15
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:demo-scenario]
command=/usr/local/bin/python /opt/aerocompliance/demo-seed.py
user=root
priority=50
autostart=true
autorestart=unexpected
startsecs=0
startretries=30
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
